# LEGACY REFERENCE ONLY (WI-INFRA-CONFIG-001).
# Production PostgreSQL: container yasnopro_pg_prod, data E:\YasnoPro\data\postgres.
# Working contours use yasnopro_dev / yasnopro_template / yasnopro_client via dev-stack manifest.
# POSTGRES_DB below is the historical init name — not used by DEV/TEMPLATE/CLIENT backends.
services:
  db:
    image: postgres:15
    container_name: portal_constructor_v2_db
    restart: always
    environment:
      POSTGRES_DB: portal_constructor_v2
      POSTGRES_USER: portal_user
      POSTGRES_PASSWORD: portal_pass
    ports:
      - "5434:5432"
    volumes:
      - portal_constructor_v2_pgdata:/var/lib/postgresql/data

volumes:
  portal_constructor_v2_pgdata:
